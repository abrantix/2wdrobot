; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ax2wdrobot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    esp32-camera
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.12.6
    me-no-dev/AsyncTCP @ 3.3.2
    AX ESP Async WebServer
    WiFi
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit BusIO @ 1.17.4

board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =   -Iinclude
				-DBOARD_HAS_PSRAM 
				-mfix-esp32-psram-cache-issue
;                -DCORE_DEBUG_LEVEL=5

extra_scripts =
    pre:tools/gen_inline_pages.py
    pre:tools/embed_source.py

; Source code zip (generated by tools/embed_source.py) that is served as /source.zip
board_build.embed_files = embedded/source.zip

